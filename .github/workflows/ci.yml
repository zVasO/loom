# Compile and test on every push: the app is macOS-only, and the agent browser's
# scripts and its Chromium protocol harness run on a real Chromium.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      selftest:
        description: "Also run the agent browser self-test (LOOM_AUTOTEST) on both engines"
        type: boolean
        default: false
      themes:
        description: "Run the theme tour instead of the suites: Loom under each theme, a picture per screen"
        type: boolean
        default: false
      themes_plan:
        description: "The tour's stops (LOOM_TOUR_PLAN, see ThemeTour.swift); the usual ones when empty"
        type: string
        default: ""

permissions:
  contents: read

# A push cancels the run it outdates; a run started by hand (the self-test)
# is in a group of its own and goes to the end.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

# The timing probes' suites: run alone, never beside the other tests.
env:
  PERF_PROBES: "PerfProbes|TerminalRowProbes|DiffRowsProbes"

jobs:
  swift:
    name: swift build + test (macOS)
    # A run started for the theme tour is about pictures: the suites ran on the push.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.themes) }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (the newest Xcode on the runner)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ runner.os }}-
      - name: Git identity (tests commit in throwaway repos)
        run: |
          git config --global user.name "Loom CI"
          git config --global user.email "ci@loom.invalid"
      # A real chrome-headless-shell for the Chromium engine's end-to-end
      # tests (LOOM_CHROMIUM); without it they are skipped, never failed.
      - name: Chromium for the agent browser's tests
        run: |
          npx --yes playwright@1.56.1 install chromium-headless-shell
          shell="$(find "$HOME/Library/Caches/ms-playwright" -type f \( -name headless_shell -o -name chrome-headless-shell \) -perm -u+x | sort | tail -1)"
          echo "headless shell: $shell"
          test -n "$shell" && echo "LOOM_CHROMIUM=$shell" >> "$GITHUB_ENV"
      - name: Build
        id: build
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log
      - name: Test
        env:
          PROBES: ${{ env.PERF_PROBES }}
        run: |
          set -o pipefail
          swift test --skip-build --skip "$PROBES" 2>&1 | tee test.log
      # Timing probes alone: their bounds are for a quiet Mac, and a virtual
      # runner is about three times slower (disk and CPU) — still an order of
      # magnitude under a lost cache, which is what they guard.
      - name: Performance probes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          LOOM_PERF_SLACK: "3"
          PROBES: ${{ env.PERF_PROBES }}
        run: |
          set -o pipefail
          swift test --skip-build --no-parallel --filter "$PROBES" 2>&1 | tee perf.log
      # The last lines of a failed job: every distinct error, nothing else —
      # what a cloud session reads back to fix the push.
      - name: Errors
        if: failure()
        run: |
          echo "::group::distinct errors"
          cat build.log test.log perf.log 2>/dev/null | grep -E "error:|✘|failed|Fatal error|originates here" | grep -v "^\s*|" | sed -E 's/^[0-9T:.Z-]+ //' | sort -u | head -80
          echo "::endgroup::"
          echo "::group::issues in full"
          cat test.log perf.log 2>/dev/null | grep -A6 "recorded an issue" | head -150
          echo "::endgroup::"

  node:
    name: node tests (${{ matrix.os }})
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.themes) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and its Chromium builds
        run: |
          npm install -g playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium chromium-headless-shell
      - name: Agent browser scripts on a real DOM
        run: node --test Tests/AgentBrowserJS/*.test.mjs
      # One file at a time, each with a watchdog: a file that hangs is named
      # and stopped, and the others still report.
      - name: Agent browser over the Chrome DevTools Protocol
        if: hashFiles('Tests/AgentBrowserCDP/*.test.mjs') != ''
        run: |
          failed=""
          for file in Tests/AgentBrowserCDP/*.test.mjs; do
            echo "::group::$file"
            start=$(date +%s)
            node --test --test-timeout=120000 "$file" &
            pid=$!
            ( sleep 300; if kill -0 "$pid" 2>/dev/null; then echo "::error::$file still running after 300 s: stopped"; pkill -9 -P "$pid"; kill -9 "$pid"; fi ) &
            watchdog=$!
            if wait "$pid"; then status=0; else status=$?; fi
            kill "$watchdog" 2>/dev/null || true
            echo "$file: exit $status after $(( $(date +%s) - start )) s"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then failed="$failed $file"; fi
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      - name: Extension SDK and examples
        working-directory: Examples/extensions
        run: npm test
      # The workflow editor (ADR-0017): its bundle is versioned — it must match
      # its sources — and it runs on a real Chromium, offline.
      - name: Workflow editor
        working-directory: WorkflowEditor
        run: |
          npm ci --no-audit --no-fund
          node build.mjs --check
          npm test

  selftest:
    name: agent browser self-test (${{ matrix.engine }})
    # Its own release build: it does not wait on the test job's verdict.
    if: github.event_name == 'workflow_dispatch' && inputs.selftest
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: spm-release-${{ runner.os }}-
      - name: Build (release)
        run: swift build -c release
      - name: Chromium for the Chromium run
        if: matrix.engine == 'chromium'
        run: |
          npx --yes playwright@1.56.1 install chromium-headless-shell
          shell="$(find "$HOME/Library/Caches/ms-playwright" -type f \( -name headless_shell -o -name chrome-headless-shell \) -perm -u+x | sort | tail -1)"
          test -n "$shell" && echo "LOOM_CHROMIUM=$shell" >> "$GITHUB_ENV"
      - name: Self-test
        timeout-minutes: 20
        env:
          LOOM_AUTOTEST: agent-browser
          LOOM_AUTOTEST_ENGINE: ${{ matrix.engine }}
          LOOM_AUTOTEST_FIXTURES: ${{ github.workspace }}/Tests/AgentBrowserJS/fixtures
        run: swift run -c release LoomApp
      # In the log too: a cloud session reads logs, not artifacts.
      - name: Report (log)
        if: always()
        run: cat /tmp/loom-agent-browser-report.json 2>/dev/null || echo "no report"
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-browser-report-${{ matrix.engine }}
          path: /tmp/loom-agent-browser-report.json
          if-no-files-found: warn

  # Loom on a real display under each theme of a plan — the built-in ones and
  # tweakcn exports followed whole — with a picture of every screen: what no
  # unit test sees of a theme's radius, spacing, fonts and shadows.
  themes:
    name: theme tour
    if: github.event_name == 'workflow_dispatch' && inputs.themes
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
      # The test job's build, when it left one: read, never written.
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ runner.os }}-
      - name: Build
        run: swift build
      # No claude on a runner: a stand-in on PATH paints the sessions' screens.
      - name: Tour
        timeout-minutes: 15
        env:
          LOOM_AUTOTEST: themes
          LOOM_SUPPORT_DIR: ${{ runner.temp }}/loom-tour
          LOOM_TOUR_THEMES: ${{ github.workspace }}/Tests/ThemeTour/themes
          LOOM_TOUR_PROJECT: ${{ github.workspace }}
          LOOM_TOUR_OUT: ${{ runner.temp }}/theme-tour
          LOOM_TOUR_PLAN: ${{ inputs.themes_plan || 'loom:dark,loom:light:core,default:light:core,neo-brutalism:light,claymorphism:light:core,violet-bloom:dark,notebook:light:core,mono:dark:core,kodama-grove:dark:core,pastel-dreams:light:core,neo-brutalism:dark:colours:core' }}
        run: |
          export PATH="$PWD/Tests/ThemeTour/bin:$PATH"
          swift run --skip-build LoomApp
      - name: Index (log)
        if: always()
        run: cat "$RUNNER_TEMP/theme-tour/tour.json" 2>/dev/null || echo "no index"
      - name: Pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-tour
          path: ${{ runner.temp }}/theme-tour
          if-no-files-found: warn
      # TEMPORARY, while the display is being put right from a cloud session
      # that cannot download artifacts: the pictures come back on the branch
      # that asked for them, in a commit dropped before the work is done.
      - name: Pictures to the branch (temporary)
        if: always()
        run: |
          mkdir -p .theme-tour && cp -R "$RUNNER_TEMP/theme-tour/." .theme-tour/ || exit 0
          git config user.name "Loom CI" && git config user.email "ci@loom.invalid"
          git add -f .theme-tour
          git commit -q -m "theme tour pictures (temporary)"
          git push origin "HEAD:${{ github.ref_name }}"
